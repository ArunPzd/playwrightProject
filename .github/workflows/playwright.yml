name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      CLOUD_BASE_URL: http://127.0.0.1:3000
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Build Cloud QA Lab Docker image
      run: docker build -t cloud-qa-lab:ci ./cloud-qa-lab

    - name: Start Cloud QA Lab container
      run: docker run -d --name cloud-qa-lab-ci -p 3000:3000 cloud-qa-lab:ci

    - name: Wait for Cloud QA Lab
      run: |
        for i in {1..15}; do
          if curl --fail http://localhost:3000/; then
            echo "Cloud QA Lab is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Cloud QA Lab did not start"
        docker logs cloud-qa-lab-ci
        exit 1

    - name: Run Playwright tests
      run: npx playwright test

      
    - name: Stop Cloud QA Lab container
      if: always()
      run: docker rm -f cloud-qa-lab-ci || true

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
