name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      CLOUD_BASE_URL: http://127.0.0.1:3000
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::422632816973:role/GitHubActionsCloudQALabDeployRole
        aws-region: us-east-2
      
    - name: Build Cloud QA Lab Docker image
      run: docker build -t cloud-qa-lab:ci ./cloud-qa-lab

    - name: Start Cloud QA Lab container
      run: docker run -d --name cloud-qa-lab-ci -p 3000:3000 cloud-qa-lab:ci

    - name: Wait for Cloud QA Lab
      run: |
        for i in {1..15}; do
          if curl --fail http://localhost:3000/; then
            echo "Cloud QA Lab is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Cloud QA Lab did not start"
        docker logs cloud-qa-lab-ci
        exit 1

    
    - name: Run Playwright tests
      run: npx playwright test

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Tag Docker image
      if: github.event_name != 'pull_request'
      run: docker tag cloud-qa-lab:ci ghcr.io/arunpzd/cloud-qa-lab:latest

    - name: Push Docker image
      if: github.event_name != 'pull_request'
      run: docker push ghcr.io/arunpzd/cloud-qa-lab:latest

    
    
    
    - name: Deploy Cloud QA Lab to EC2 via SSM
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        set -euo pipefail

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids i-02238e1ad13ef3ec3 \
          --document-name "AWS-RunShellScript" \
          --parameters '{"commands":["set -euo pipefail","docker pull ghcr.io/arunpzd/cloud-qa-lab:latest","docker rm -f cloud-qa-lab-ghcr || true","docker run -d --name cloud-qa-lab-ghcr -p 3001:3000 ghcr.io/arunpzd/cloud-qa-lab:latest","for i in $(seq 1 15); do if curl -fsS http://localhost:3001/ >/dev/null; then echo Deployment healthy; exit 0; fi; sleep 2; done; echo Health check failed; docker logs cloud-qa-lab-ghcr; exit 1"]}' \
          --query "Command.CommandId" \
          --output text)

        echo "SSM command ID: $COMMAND_ID"

        set +e
        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id i-02238e1ad13ef3ec3
        WAITER_STATUS=$?
        set -e

        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id i-02238e1ad13ef3ec3 \
          --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
          --output json

        if [ "$WAITER_STATUS" -ne 0 ]; then
          echo "Deployment command failed or did not finish successfully."
          exit 1
        fi

      
    - name: Stop Cloud QA Lab container
      if: always()
      run: docker rm -f cloud-qa-lab-ci || true

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
